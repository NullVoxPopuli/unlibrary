name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          cache: pnpm

      - run: pnpm install
      - run: pnpm lint:eslint
      - run: pnpm lint:format

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          cache: pnpm

      - run: pnpm install
      - run: pnpm test
